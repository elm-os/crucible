[package]
name = "crucible-recent"
description = "In-memory recent-span index for read-after-write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A manual clock and a WAL view for tests of the index and of its readers. Product builds never enable it.
test-support = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-plan = { workspace = true }
hashbrown = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
crucible-auth = { workspace = true, features = ["test-support"] }
shuttle = { workspace = true }

[lints]
workspace = true
