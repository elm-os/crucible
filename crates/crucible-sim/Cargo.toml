[package]
name = "crucible-sim"
description = "Deterministic simulation harness, fault models, system models and invariants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-wal = { workspace = true, features = ["test-mutants"] }
crucible-wal-codec = { workspace = true }
crucible-schema = { workspace = true }
crucible-chfmt = { workspace = true }
crucible-plan = { workspace = true }
crucible-shipper = { workspace = true, features = ["test-mutants"] }
crucible-recent = { workspace = true, features = ["test-mutants"] }
crucible-query = { workspace = true }
crucible-ingest = { workspace = true, features = ["test-mutants"] }
crucible-normalize = { workspace = true }
crucible-otlp = { workspace = true }
crucible-admission = { workspace = true }
crucible-auth = { workspace = true, features = ["test-support"] }
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-control = { path = "../crucible-control" }
# A path dependency, for the same reason. The jobs simulation runs the real runners.
crucible-jobs = { path = "../crucible-jobs", features = ["test-mutants"] }
async-trait = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
serde_json = { workspace = true }
shuttle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
turmoil = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
mad-turmoil = { workspace = true }

[dev-dependencies]
crucible-compat = { workspace = true }
crucible-env-prod = { workspace = true }
proptest = { workspace = true }
tempfile = "=3.27.0"

[lints]
workspace = true
