[package]
name = "crucible"
description = "The Crucible server binary: ingest, API, MCP server, proxy and embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
wal-uring = ["crucible-env-prod/wal-uring"]
# Embeds the built UI (ui/out); see docs/development.md.
embed-ui = ["crucible-ui-assets/embed-ui"]

[dependencies]
# Path dependencies: these crates have no entry in the root [workspace.dependencies] table yet.
crucible-api = { workspace = true }
crucible-api-types = { workspace = true }
crucible-auth = { workspace = true }
# Path dependencies: these crates have no entry in the root [workspace.dependencies] table yet.
crucible-config = { workspace = true }
crucible-control = { workspace = true }
crucible-control-pg = { workspace = true }
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-jobs = { path = "../crucible-jobs" }
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-cursor = { workspace = true }
# The compat ingest routes that the ingest listeners serve (contract 12.1).
crucible-compat = { workspace = true }
crucible-env = { workspace = true }
crucible-env-prod = { workspace = true }
crucible-ingest = { workspace = true }
crucible-normalize = { workspace = true }
crucible-plan = { workspace = true }
crucible-query = { workspace = true }
crucible-recent = { workspace = true }
crucible-records = { workspace = true }
crucible-schema = { workspace = true }
crucible-shipper = { workspace = true }
crucible-store-clickhouse = { workspace = true }
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-ui-assets = { workspace = true }
crucible-wal = { workspace = true }
crucible-wal-codec = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio", "json", "query", "matched-path", "tracing"] }
clap = { workspace = true }
# HKDF-SHA256 for the passwords of the generated ClickHouse identities (contract 7.1).
hkdf = "=0.13.0"
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
# The `--keys-file` parser; reading only.
toml = { workspace = true, features = ["std", "serde", "parse"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Basic credentials for the compat route sends.
base64 = { workspace = true }
# The end-to-end test (tests/e2e.rs) drives the load generator as a library and reads ClickHouse directly.
crucible-loadgen = { path = "../crucible-loadgen" }
crucible-otlp = { workspace = true }
# The gRPC sends: the generated OTLP client over tonic's HTTP/2 channel.
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
prost = { workspace = true }
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "gzip"] }
crucible-sim = { path = "../crucible-sim" }
crucible-store-clickhouse = { workspace = true, features = ["test-support"] }
# The gzip body of the compat route send.
flate2 = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-util", "time"] }

[target.'cfg(not(windows))'.dependencies]
mimalloc = { workspace = true }

# The one package cargo-dist releases (dist-workspace.toml); without this, `publish = false` hides it.
[package.metadata.dist]
dist = true

[lints]
workspace = true
