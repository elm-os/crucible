[package]
name = "crucible-proxy"
description = "The MCP proxy: byte-identical passthrough for stdio and Streamable HTTP servers, with telemetry on a copy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "crucible-proxy-rig"
path = "src/main.rs"
test = false
doc = false

[features]
# Seeded defects that the deterministic tests must catch (`core::Mutant`). Inert unless a test configures one;
# never enabled by the crucible binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# The keyed multi-round state hashes (contract 9.6).
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
memchr = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
# The shared scrubbing rules (contract 9.10), whose patterns this crate matches in linear time.
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
tracing = { workspace = true }

# Signature verification of the opt-in `verified` identity mode (contract 9.3). MIT. The pure-Rust backend:
# no C toolchain on any platform.
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
async-trait = { workspace = true }
# The crate's own seeded defects, so the tests can check that they are caught.
crucible-proxy = { path = ".", features = ["test-mutants"] }
# The production Env, the real child processes and the loopback collector of the process tests.
crucible-env-prod = { workspace = true }
crucible-fake-collector = { path = "../crucible-fake-collector" }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "macros", "sync"] }

[lints]
workspace = true
