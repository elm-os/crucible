[package]
name = "crucible-proxy"
description = "The MCP proxy: byte-identical passthrough for stdio and Streamable HTTP servers, with telemetry on a copy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Seeded defects that the deterministic tests must catch (`core::Mutant`). Inert unless a test configures one;
# never enabled by the crucible binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The crate's own seeded defects, so the tests can check that they are caught.
crucible-proxy = { path = ".", features = ["test-mutants"] }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
