[package]
name = "crucible-ingest"
description = "OTLP HTTP and gRPC ingest handlers in front of the WAL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A seeded defect for the simulation suite, which must catch it. Never enabled by the binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-otlp = { workspace = true }
crucible-admission = { workspace = true }
crucible-wal = { workspace = true }
crucible-wal-codec = { workspace = true }
crucible-auth = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio", "json", "query", "matched-path", "tracing"] }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# gRPC ingest (contract 12.1): tonic's server-side codec and status machinery behind an axum route, with gzip;
# no transport, since the listener is the binary's.
tonic = { version = "=0.14.9", default-features = false, features = ["gzip"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
crucible-auth = { workspace = true, features = ["test-support"] }
# The key rows of the Postgres key snapshot, whose scopes the scope refusals need.
crucible-control = { workspace = true }
crucible-env-prod = { workspace = true }
crucible-sim = { path = "../crucible-sim" }
# The seeded ack-before-sync defect, which the durability test must catch.
crucible-wal = { workspace = true, features = ["test-mutants"] }
# `gen-tonic` adds the generated `TraceServiceClient` that the gRPC tests drive.
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace", "with-serde"] }
proptest = { workspace = true }
prost = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
