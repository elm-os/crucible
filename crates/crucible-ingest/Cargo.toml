[package]
name = "crucible-ingest"
description = "OTLP HTTP and gRPC ingest handlers in front of the WAL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A seeded defect for the simulation suite, which must catch it. Never enabled by the binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-otlp = { workspace = true }
crucible-admission = { workspace = true }
crucible-wal = { workspace = true }
crucible-wal-codec = { workspace = true }
crucible-auth = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio", "json", "query", "matched-path", "tracing"] }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crucible-auth = { workspace = true, features = ["test-support"] }
crucible-env-prod = { workspace = true }
crucible-sim = { path = "../crucible-sim" }
# The seeded ack-before-sync defect, which the durability test must catch.
crucible-wal = { workspace = true, features = ["test-mutants"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }
proptest = { workspace = true }
prost = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
