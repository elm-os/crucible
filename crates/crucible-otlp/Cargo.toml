[package]
name = "crucible-otlp"
description = "Zero-copy OTLP protobuf scanner, span views and JSON transcoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crucible-records = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
# Exact float parsing, so JSON doubles transcode bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
prost = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }

[lints]
workspace = true
