[package]
name = "crucible-store-clickhouse"
description = "TelemetryStore implementation on the ClickHouse HTTP interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Raw statements for the conformance suite's scratch tables. Product builds never enable it.
test-support = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-schema = { workspace = true }
crucible-chfmt = { workspace = true }
crucible-plan = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clickhouse = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crucible-auth = { workspace = true, features = ["test-support"] }
crucible-plan = { workspace = true, features = ["test-support"] }
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
