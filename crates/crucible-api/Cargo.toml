[package]
name = "crucible-api"
description = "The REST API under /api/v1: routes, authentication, problems and the OpenAPI document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-api-types = { workspace = true }
crucible-auth = { workspace = true }
crucible-control = { workspace = true }
# A path dependency: the crate has no entry in the root [workspace.dependencies] table yet.
crucible-cursor = { workspace = true }
crucible-env = { workspace = true }
crucible-plan = { workspace = true }
crucible-query = { workspace = true }
crucible-records = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
crucible-auth = { workspace = true, features = ["test-support"] }
crucible-control = { workspace = true }
crucible-chfmt = { workspace = true }
crucible-recent = { workspace = true, features = ["test-support"] }
crucible-schema = { workspace = true }
crucible-sim = { path = "../crucible-sim" }
async-trait = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
