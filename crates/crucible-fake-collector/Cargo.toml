[package]
name = "crucible-fake-collector"
description = "Loopback OTLP/HTTP collector and the SDK conformance driver, crucible-sdk-driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "crucible-sdk-driver"
path = "src/main.rs"

[features]
# Seeded defects for the self-test runner, which the driver must flag. Never enabled by the crucible binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-env-prod = { workspace = true }
crucible-records = { workspace = true }
crucible-otlp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

# HMAC-SHA256 for the multi-round state hashes of contract 9.6.
hmac = "=0.13.0"

[dev-dependencies]
# The crate's own seeded defects, so the tests can check that the driver flags each of them.
crucible-fake-collector = { path = ".", features = ["test-mutants"] }
proptest = { workspace = true }

[lints]
workspace = true
