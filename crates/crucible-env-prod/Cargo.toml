[package]
name = "crucible-env-prod"
description = "Production implementations of the crucible-env traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
wal-uring = ["dep:io-uring"]

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal", "process"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }

# SMTP for the `Mailer` (contract 2.11), with the workspace's TLS stack: rustls on ring with the bundled web
# roots. No connection pool, no host-name lookup, no native TLS. MIT.
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }

# Safe wrappers for space reservation and free-space queries on every platform (unsafe code is denied here).
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }

# Process groups (Unix) and Job Objects (Windows) for the proxy's child (contract 2.8). MIT OR Apache-2.0.
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
# The parent-death signal of the child trampoline; the version process-wrap already uses.
nix = { version = "=0.31.4", default-features = false, features = ["process", "signal"] }
io-uring = { workspace = true, optional = true }

[lints]
workspace = true
