[package]
name = "crucible-conformance"
description = "Differential conformance scripts against real ClickHouse and Postgres."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p crucible-conformance` is the ClickHouse suite; the Postgres suite is `--bin crucible-pg-conformance`.
default-run = "crucible-conformance"

[dependencies]
crucible-env = { workspace = true }
crucible-env-prod = { workspace = true }
crucible-records = { workspace = true }
crucible-schema = { workspace = true }
crucible-chfmt = { workspace = true }
crucible-plan = { workspace = true, features = ["test-support"] }
crucible-store-clickhouse = { workspace = true, features = ["test-support"] }
crucible-auth = { workspace = true, features = ["test-support"] }
# The store model that the differential rows compare with the real server.
crucible-sim = { path = "../crucible-sim" }
# The control store: the traits, the Postgres adapter and (in crucible-sim) its model.
crucible-control = { path = "../crucible-control" }
crucible-control-pg = { path = "../crucible-control-pg", features = ["test-support"] }
anyhow = { workspace = true }
# The connection-counting `Net` of the idle-connection rows.
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "crucible-pg-conformance"
path = "src/pg_main.rs"

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
