[package]
name = "crucible-loadgen"
description = "Open-loop OTLP load generator for the performance rig."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crucible-env = { workspace = true }
crucible-env-prod = { workspace = true }
crucible-records = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
hdrhistogram = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
