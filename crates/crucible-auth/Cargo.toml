[package]
name = "crucible-auth"
description = "Authentication and authorization; in M1 project keys from configuration and ProjectScope minting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test helpers for other crates; product builds never enable it. The fake sign-in provider serves HTTP.
test-support = ["hyper/server", "tokio/io-util"]

[dependencies]
crucible-control = { workspace = true }
crucible-env = { workspace = true }
crucible-records = { workspace = true }
async-trait = { workspace = true }
# Basic credentials (contract 12.2).
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Constant-time comparison of key hashes.
subtle = { version = "=2.6.1", default-features = false }
# Exact versions until the root [workspace.dependencies] table lists them.
# Argon2id password hashing (contract 11.4); salts come from `Rng`, so no randomness feature is enabled.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# Sealing of secrets at rest (contract 11.2): XChaCha20-Poly1305 under a subkey the binary derives.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
# OAuth 2.0 and OpenID Connect clients (contract 11.4), without their bundled HTTP clients: requests go through `Net`.
oauth2 = { version = "=5.0.0", default-features = false }
openidconnect = { version = "=4.1.0", default-features = false }
# The time type of openidconnect's ID-token checks, fed from the `Env` clock; the version openidconnect locks.
chrono = { version = "=0.4.45", default-features = false }

[dev-dependencies]
# The simulated `Env` and `PgModel`. The cycle through crucible-sim's own dependency on this crate is the one
# cargo permits for dev-dependencies; tests here never pass this crate's types through it.
crucible-sim = { path = "../crucible-sim" }
hyper = { workspace = true, features = ["server"] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
