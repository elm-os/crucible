[package]
name = "crucible-ui-assets"
description = "Embedded UI asset serving with the try-files contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Embeds ui/out at build time. Build the UI first (docs/development.md); without ui/out the build fails.
embed-ui = ["dep:rust-embed"]

[dependencies]
crucible-env = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
# debug-embed: every profile embeds (without it, debug builds read the folder at run time).
# deterministic-timestamps: no file times in the binary.
rust-embed = { workspace = true, optional = true, features = ["debug-embed", "deterministic-timestamps"] }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rust-embed = { workspace = true, features = ["debug-embed", "deterministic-timestamps"] }

[lints]
workspace = true
