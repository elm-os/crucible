[package]
name = "crucible-shipper"
description = "Batch sealing, deduplicated inserts, existence probes and checkpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Seeded defects for the simulation suite, which must catch each of them. Never enabled by the binary.
test-mutants = []

[dependencies]
crucible-env = { workspace = true }
crucible-records = { workspace = true }
crucible-wal = { workspace = true }
crucible-wal-codec = { workspace = true }
crucible-schema = { workspace = true }
crucible-chfmt = { workspace = true }
crucible-normalize = { workspace = true }
crucible-plan = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
prost = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }

[lints]
workspace = true
