# Steps that .github/workflows/release.yml (generated by dist from dist-workspace.toml) runs before each binary
# build: the UI's static export and its precompressed variants, which the `embed-ui` feature compiles in. dist's
# template needs a name on every step.
- name: Install pnpm
  uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
- name: Install Node
  uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  with:
    node-version: 24
    # A release build restores no cache. setup-node caches by itself only for npm, so this changes nothing today.
    package-manager-cache: false
- name: Build the UI
  shell: bash
  run: |
    pnpm install --frozen-lockfile --ignore-scripts --filter crucible-ui
    pnpm --filter crucible-ui build
    cargo xtask ui compress
