name: drift

# The OpenAPI document and the UI's TypeScript types are generated from the Rust handlers and DTOs and
# committed. This job regenerates both and fails when the result differs from what is committed, and when a
# generated type uses `bigint` (contract 1.3). It also fails when the model tables of docs/guides/priced-models.md
# differ from what tools/docs/priced-models.py writes from the bundled price table.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The generator expands the price table's patterns with Python's own regex parser, whose output may change
      # between Python versions, so the version is pinned.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The priced-models tables match the price table
        run: python3 -I tools/docs/priced-models.py --check
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regenerate the OpenAPI document
        run: cargo run --locked --quiet --package crucible -- openapi > specs/openapi/crucible-v1.json
      - name: Regenerate the TypeScript types
        run: cargo run --locked --quiet --package xtask -- gen-ts
      - name: The committed files match
        run: |
          changed=$(git status --porcelain -- specs/openapi ui/src/api/generated)
          if [ -n "$changed" ]; then
            echo "Generated files differ from the committed ones:"
            echo "$changed"
            git diff -- specs/openapi ui/src/api/generated
            echo "Regenerate with: cargo run -p crucible -- openapi > specs/openapi/crucible-v1.json && cargo xtask gen-ts"
            exit 1
          fi
      - name: No bigint in the generated types
        run: |
          if grep -rn 'bigint' ui/src/api/generated; then
            echo "A generated type uses bigint; give the field a wire newtype from crucible-api-types."
            exit 1
          fi
