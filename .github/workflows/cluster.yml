name: cluster

# Crucible on a replicated ClickHouse: one shard of two replicas coordinated by ClickHouse Keeper, as
# deploy/compose/compose.cluster.yaml runs it, beside Postgres 18. Per server version, each on a fresh cluster:
#   - the end-to-end run of the server (crates/crucible/tests/e2e.rs, the cluster path): it migrates every step
#     ON CLUSTER, ingests a trace that every replica holds, reads it back, and deletes it from every replica;
#   - a migration with a replica down, and a new cluster beside another deployment's Postgres, whose ledger
#     records steps that created service users no replica holds;
#   - the conformance suite (crates/crucible-conformance): its rows on the cluster, among them one token landing
#     once across replicas, the existence probe before a quorum, a replica that goes down in the middle of an
#     insert, and retention and deletion on every replica, with one replica down and back;
#   - the SQL workspace's isolation suite, layers A, B and D (docs/testing/sqliso.md), with every workspace user
#     and policy provisioned ON CLUSTER, under both values of the server switch
#     users_without_row_policies_can_read_rows, then layer D's D8 mutant: the suite declared strict on a
#     permissive cluster, which must fail.
# Apart from the permissive run, the replicas hide rows from users without a row policy (the strict value of the
# switch), so the service-identity checks are meaningful.

on:
  pull_request:
    paths:
      - crates/crucible-store-clickhouse/**
      - crates/crucible-conformance/**
      - crates/crucible-schema/**
      - crates/crucible-plan/**
      - crates/crucible-lifecycle/**
      - crates/crucible-sqlws/**
      - crates/crucible-config/**
      - crates/crucible-env/src/store.rs
      - crates/crucible/**
      - deploy/compose/compose.cluster.yaml
      - Cargo.lock
      - .github/workflows/cluster.yml
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The variables the Compose file reads.
  CLICKHOUSE_PASSWORD: cluster-admin
  CLICKHOUSE_CLUSTER_SECRET: cluster-secret
  POSTGRES_PASSWORD: cluster-postgres
  CRUCIBLE_MASTER_KEY: 5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c

jobs:
  cluster:
    name: cluster on clickhouse ${{ matrix.tag }}
    runs-on: ubuntu-latest
    # Nightly, the isolation suite provisions ten times as many identities, each of them ON CLUSTER.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        tag: ["26.8", "latest"]
    env:
      TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cluster
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The server is built on its own, never with the workspace or beside the test: either would compile the
      # test-only features of other crates' dependencies into it.
      - name: Build the server
        run: |
          cargo build --locked --package crucible
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/crucible "$RUNNER_TEMP/bin/crucible"
      - name: Build the suites and the test
        run: |
          cargo build --locked -p crucible-conformance
          cargo test --locked --package crucible --test e2e --no-run
      # The operator's Compose file with the server version under test, the server switch, and the ports of both
      # replicas and of Postgres published, because the suites run on the runner. `fresh` starts a new cluster,
      # strict unless its argument is `permissive`.
      - name: The cluster's override
        run: |
          mkdir -p "$RUNNER_TEMP/cluster"
          cat > "$RUNNER_TEMP/cluster/override.yaml" <<YAML
          services:
            clickhouse-1:
              image: clickhouse/clickhouse-server:$TAG
              ports: ["18123:8123"]
              volumes:
                - $RUNNER_TEMP/cluster/switch.xml:/etc/clickhouse-server/config.d/switch.xml:ro
            clickhouse-2:
              image: clickhouse/clickhouse-server:$TAG
              ports: ["28123:8123"]
              volumes:
                - $RUNNER_TEMP/cluster/switch.xml:/etc/clickhouse-server/config.d/switch.xml:ro
            postgres:
              ports: ["5432:5432"]
          YAML
          cat > "$RUNNER_TEMP/cluster/fresh.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          # The switch: false hides rows from users without a row policy (strict), true shows them (permissive).
          can_read=false
          [ "${1:-strict}" = permissive ] && can_read=true
          cat > "$RUNNER_TEMP/cluster/switch.xml" <<XML
          <clickhouse>
            <access_control_improvements>
              <users_without_row_policies_can_read_rows>$can_read</users_without_row_policies_can_read_rows>
            </access_control_improvements>
          </clickhouse>
          XML
          chmod 644 "$RUNNER_TEMP/cluster/switch.xml"
          stack() {
            docker compose -p cluster -f deploy/compose/compose.cluster.yaml -f "$RUNNER_TEMP/cluster/override.yaml" "$@"
          }
          stack down -v >/dev/null 2>&1 || true
          stack up -d --wait keeper clickhouse-1 clickhouse-2 postgres
          SH
          chmod +x "$RUNNER_TEMP/cluster/fresh.sh"
      - name: End to end
        env:
          CRUCIBLE_E2E_CLICKHOUSE_URL: http://localhost:18123
          CRUCIBLE_E2E_CLICKHOUSE_REPLICAS: http://localhost:28123
          CRUCIBLE_E2E_CLICKHOUSE_CLUSTER: crucible
          CRUCIBLE_E2E_CLICKHOUSE_USER: crucible_admin
          CRUCIBLE_E2E_CLICKHOUSE_PASSWORD: cluster-admin
          CRUCIBLE_E2E_POSTGRES_URL: postgres://crucible:cluster-postgres@localhost:5432/crucible
        run: |
          "$RUNNER_TEMP/cluster/fresh.sh"
          export CRUCIBLE_E2E_BIN="$RUNNER_TEMP/bin/crucible"
          export CRUCIBLE_E2E_OUT="$PWD/cluster-out"
          cargo test --locked --package crucible --test e2e -- --nocapture
      # Every replica runs a migration step's ON CLUSTER statements: with one stopped, `crucible migrate` fails,
      # names it, and records nothing; once it is back the same command applies every step.
      - name: A migration with a replica down
        env:
          CRUCIBLE_CLICKHOUSE_URL: http://localhost:18123
          CRUCIBLE_CLICKHOUSE_CLUSTER: crucible
          CRUCIBLE_CLICKHOUSE_PASSWORD: cluster-admin
          CRUCIBLE_POSTGRES_URL: postgres://crucible:cluster-postgres@localhost:5432/crucible
        run: |
          "$RUNNER_TEMP/cluster/fresh.sh"
          stack() {
            docker compose -p cluster -f deploy/compose/compose.cluster.yaml -f "$RUNNER_TEMP/cluster/override.yaml" "$@"
          }
          recorded() {
            stack exec -T postgres psql -U crucible -d crucible -Atc "SELECT count(*) FROM schema_migrations WHERE kind LIKE 'clickhouse%'"
          }
          stack stop clickhouse-2
          if out=$("$RUNNER_TEMP/bin/crucible" migrate 2>&1); then
            echo "crucible migrate passed with a replica stopped: $out"
            exit 1
          fi
          echo "$out" | tail -5
          echo "$out" | grep -q "clickhouse-2:9000 in cluster crucible did not answer"
          [ "$(recorded)" = 0 ] || { echo "the ledger recorded a step: $(recorded)"; exit 1; }
          stack start clickhouse-2
          stack up -d --wait clickhouse-2
          "$RUNNER_TEMP/bin/crucible" migrate
          [ "$(recorded)" = 5 ] || { echo "the ledger records $(recorded) of 5 ClickHouse steps"; exit 1; }
      # A new cluster beside the Postgres of a deployment on another ClickHouse: the ledger records the steps that
      # created service users which no replica holds. `crucible migrate` fails and a server's start stays not ready,
      # both saying so with the fix and not blaming the master key; the fix, an empty ledger, lets the cluster
      # migrate. A wrong master key, with a step that changed, keeps its own message.
      - name: A new cluster beside another deployment's Postgres
        env:
          CRUCIBLE_CLICKHOUSE_URL: http://localhost:18123
          CRUCIBLE_CLICKHOUSE_CLUSTER: crucible
          CRUCIBLE_CLICKHOUSE_PASSWORD: cluster-admin
          CRUCIBLE_POSTGRES_URL: postgres://crucible:cluster-postgres@localhost:5432/crucible
        run: |
          "$RUNNER_TEMP/cluster/fresh.sh"
          stack() {
            docker compose -p cluster -f deploy/compose/compose.cluster.yaml -f "$RUNNER_TEMP/cluster/override.yaml" "$@"
          }
          ledger() {
            stack exec -T postgres psql -U crucible -d crucible -Atc "$1"
          }
          missing="but no replica in cluster crucible holds any of them"
          "$RUNNER_TEMP/bin/crucible" migrate
          # The replicas and Keeper start again from empty volumes, and Postgres keeps the ledger.
          stack rm -sfv keeper clickhouse-1 clickhouse-2
          docker volume rm cluster_keeper-data cluster_clickhouse-1-data cluster_clickhouse-2-data
          stack up -d --wait keeper clickhouse-1 clickhouse-2
          if out=$("$RUNNER_TEMP/bin/crucible" migrate 2>&1); then
            echo "crucible migrate passed beside another ClickHouse's ledger: $out"
            exit 1
          fi
          echo "$out" | tail -3
          echo "$out" | grep -q "$missing"
          if echo "$out" | grep -q "master key"; then
            echo "the refusal blames the master key"
            exit 1
          fi
          for migrate in --migrate ""; do
            timeout 30 "$RUNNER_TEMP/bin/crucible" serve $migrate --data-dir "$RUNNER_TEMP/serve-data" \
              --listen 127.0.0.1:0 --ingest-listen 127.0.0.1:0 --grpc-listen 127.0.0.1:0 \
              --metrics-listen 127.0.0.1:0 > serve.log 2>&1 || true
            grep -q "$missing" serve.log || { echo "serve $migrate:"; tail -20 serve.log; exit 1; }
          done
          ledger "DELETE FROM schema_migrations WHERE kind LIKE 'clickhouse%'"
          "$RUNNER_TEMP/bin/crucible" migrate
          [ "$(ledger "SELECT count(*) FROM schema_migrations WHERE kind LIKE 'clickhouse%'")" = 5 ]
          if out=$(CRUCIBLE_MASTER_KEY=0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad0bad \
            CRUCIBLE_SQL_STATEMENTS_PER_HOUR=1200 "$RUNNER_TEMP/bin/crucible" migrate 2>&1); then
            echo "crucible migrate passed with a wrong master key: $out"
            exit 1
          fi
          echo "$out" | grep -q "refuse this server's master key"
      # A suite's exit status, not tee's, decides each step that writes a report.
      - name: Conformance rows
        run: |
          set -o pipefail
          "$RUNNER_TEMP/cluster/fresh.sh"
          target/debug/crucible-conformance --url http://localhost:18123 --replica-url http://localhost:28123 \
            --cluster crucible --user crucible_admin --password cluster-admin --label "$TAG cluster" \
            | tee conformance.tsv
      - name: SQL workspace isolation, layers A, B and D
        env:
          # Nightly: ten times the statements and identities of a pull request.
          FUZZ: ${{ github.event_name == 'schedule' && '50000' || '5000' }}
          IDENTITIES: ${{ github.event_name == 'schedule' && '200' || '20' }}
          SEED: ${{ github.run_number }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/cluster/fresh.sh"
          target/debug/crucible-sqliso --url http://localhost:18123 --cluster crucible --user crucible_admin \
            --password cluster-admin --label "$TAG cluster" --switch strict --fuzz "$FUZZ" --seed "$SEED" \
            --identities "$IDENTITIES" | tee sqliso.tsv
      # The same layers under the permissive value of the switch, with a fifth of the statements and 20 identities
      # as sqliso.yml runs them on a single server. Then layer D's D8 mutant: on this permissive cluster, the suite
      # declared strict must fail on row W0.
      - name: SQL workspace isolation under the permissive switch, and the D8 mutant
        env:
          FUZZ: ${{ github.event_name == 'schedule' && '10000' || '1000' }}
          SEED: ${{ github.run_number }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/cluster/fresh.sh" permissive
          run() {
            target/debug/crucible-sqliso --url http://localhost:18123 --cluster crucible --user crucible_admin \
              --password cluster-admin --label "$TAG cluster" "$@"
          }
          status=0
          run --switch permissive --layers a,b,d --fuzz "$FUZZ" --seed "$SEED" --identities 20 \
            | tee permissive.tsv || status=1
          if run --switch strict --layers none > flipped.tsv; then
            printf 'FAIL\t%s\tD8 mutant: the server switch flipped\tthe suite passed a cluster whose switch is not the declared one\n' "$TAG cluster" | tee -a permissive.tsv
            status=1
          else
            printf 'PASS\t%s\tD8 mutant: the server switch flipped\tcaught by W0 deployment as declared\n' "$TAG cluster" | tee -a permissive.tsv
          fi
          exit $status
      - name: Server logs
        if: failure()
        run: |
          docker compose -p cluster -f deploy/compose/compose.cluster.yaml -f "$RUNNER_TEMP/cluster/override.yaml" \
            logs --no-color --tail 200 keeper clickhouse-1 clickhouse-2
      - name: Report
        if: always()
        run: |
          {
            echo "### Clustered ClickHouse $TAG"
            for file in conformance sqliso permissive; do
              [ -f "$file.tsv" ] || continue
              echo
              echo "$file"
              echo
              echo '| Result | Row | Detail |'
              echo '|---|---|---|'
              awk -F'\t' 'NF >= 4 { detail = $4; gsub(/\|/, "\\|", detail); print "| " $1 " | " $3 " | " substr(detail, 1, 600) " |" }' "$file.tsv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-${{ matrix.tag }}
          path: |
            *.tsv
            cluster-out
          if-no-files-found: ignore
