name: ui-e2e

# Playwright with axe against the static export: each section of /home/, /traces/ and /trace/ in its
# loading, success, error and empty states, keyboard paths, and phone width. The surface-by-state table
# is docs/testing/ui-surfaces.md.

on:
  pull_request:
    paths:
      - ui/**
      - pnpm-lock.yaml
      - .github/workflows/ui-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Static export
        run: pnpm --filter crucible-ui build
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./ui/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter crucible-ui exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter crucible-ui exec playwright install-deps chromium
      - name: Playwright
        run: pnpm --filter crucible-ui exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
