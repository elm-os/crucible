name: policy

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-checks the title and body when someone changes them after the PR opens.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Checker self-test
        run: node tools/policy/policy.mjs selftest
      - name: Tracked files
        run: node tools/policy/policy.mjs files
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          node tools/policy/policy.mjs commits "$range"
      - name: Pull request title, body and branch
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node tools/policy/policy.mjs text
          node tools/policy/policy.mjs branch "$HEAD_REF"
