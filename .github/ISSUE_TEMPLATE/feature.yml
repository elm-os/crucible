name: Feature request
description: Propose a specific change to Crucible. Broad ideas start in Discussions Ideas.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A broad idea, or one you would like to talk through first, belongs in [Discussions Ideas](https://github.com/elm-os/crucible/discussions/categories/ideas). Open a feature request when you can name the change you need.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind, such as a route, a page, a setting or an SDK helper.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways to solve it.
