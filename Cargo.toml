[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/elm-os/crucible"
publish = false

# Every dependency is declared once here; crates use `name.workspace = true`.
# Versions verified on crates.io on 2026-11-17.
[workspace.dependencies]
# Internal crates
crucible-env = { path = "crates/crucible-env" }
crucible-env-prod = { path = "crates/crucible-env-prod" }
crucible-records = { path = "crates/crucible-records" }
crucible-api-types = { path = "crates/crucible-api-types" }
crucible-wal-codec = { path = "crates/crucible-wal-codec" }
crucible-wal = { path = "crates/crucible-wal" }
crucible-otlp = { path = "crates/crucible-otlp" }
crucible-admission = { path = "crates/crucible-admission" }
crucible-ingest = { path = "crates/crucible-ingest" }
crucible-normalize = { path = "crates/crucible-normalize" }
crucible-compat = { path = "crates/crucible-compat" }
crucible-schema = { path = "crates/crucible-schema" }
crucible-chfmt = { path = "crates/crucible-chfmt" }
crucible-shipper = { path = "crates/crucible-shipper" }
crucible-store-clickhouse = { path = "crates/crucible-store-clickhouse" }
crucible-plan = { path = "crates/crucible-plan" }
crucible-recent = { path = "crates/crucible-recent" }
crucible-query = { path = "crates/crucible-query" }
crucible-ui-assets = { path = "crates/crucible-ui-assets" }
crucible-sim = { path = "crates/crucible-sim" }
crucible-conformance = { path = "crates/crucible-conformance" }
crucible-loadgen = { path = "crates/crucible-loadgen" }

# Runtime, HTTP and gRPC
tokio = { version = "1.54.1", default-features = false }
futures = "0.3.34"
async-trait = "0.1.92"
pin-project-lite = "0.2.17"
bytes = "1.12.2"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
axum = { version = "0.8.9", default-features = false }
tower = "0.5.3"
tower-http = "0.7.1"
tonic = { version = "0.14.9", default-features = false }
prost = "0.14.6"
opentelemetry-proto = { version = "0.33.1", default-features = false }

# Storage clients
clickhouse = { version = "0.15.3", default-features = false }
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
refinery = "0.10.0"

# Serialization, codecs, hashing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
lz4_flex = "0.14.2"
zstd = "0.14.4"
flate2 = "1.1.11"
crc32c = "0.6.9"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
blake3 = "1.8.7"
sha2 = "0.11.1"
hmac = "0.13.0"
base64 = "0.23.1"
uuid = { version = "1.29.3", default-features = false }
jiff = { version = "1.0.0", default-features = false }
regex = "1.13.1"
memchr = "2.8.3"

# Collections and randomness
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
indexmap = "2.14.2"
smallvec = "1.16.5"
arc-swap = "1.9.5"
rand_core = "0.10.1"
rand_chacha = "0.10.0"

# API types and generation
ts-rs = "12.0.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

# Errors, CLI, observability
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mimalloc = "0.1.52"
rust-embed = "8.14.0"

# Linux-only WAL backend (feature `wal-uring`)
io-uring = "0.7.16"

# MCP
rmcp = "3.11.0"

# Verification and benchmarking
turmoil = "0.7.2"
mad-turmoil = "0.2.2"
shuttle = "0.9.10"
proptest = "1.12.0"
insta = "1.49.0"
criterion = "0.8.2"
hdrhistogram = "7.6.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
large_futures = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

[profile.release-fat]
inherits = "release"
lto = "fat"

[profile.profiling]
inherits = "release"
debug = "full"

[profile.ci]
inherits = "dev"
incremental = false
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
