[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore names its reason and is revisited at every release (decisions 84).
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack affects private-key operations; openidconnect uses rsa only to verify ID-token signatures with public keys, and Crucible holds no RSA private keys" },
  { id = "RUSTSEC-2026-0543", reason = "chrono reported unmaintained; pulled by oauth2 and openidconnect with no maintained alternative yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies without versions; they are never published.
allow-wildcard-paths = true
deny = [{ crate = "openssl" }, { crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
